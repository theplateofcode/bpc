<!-- payments/_mark_full.html -->
<div>
  <h6 class="mb-2">Mark Full Payment</h6>
  <p class="text-muted mb-2">Remaining receivable: <strong>{{ remaining|floatformat:0 }}</strong></p>
  <form
    hx-post="{% url 'mark_full' booking.id %}"
    hx-target="#paymentsModal .modal-body"
    hx-swap="innerHTML">
    {% csrf_token %}
    <div class="row g-2">
      <div class="col-md-4">
        <input name="amount" type="number" step="1" min="0" class="form-control" placeholder="Enter amount" required>
      </div>
      <div class="col-md-4">
        <select name="mode" class="form-select" required>
          {% for m in modes %}
            <option value="{{ m.id }}">{{ m.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-4">
        <input name="remarks" class="form-control" placeholder="Remarks (optional)">
      </div>
    </div>
    <div class="mt-2 d-flex gap-2">
      <button class="btn btn-success">Confirm & Close</button>
      <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
      <div class="htmx-indicator spinner-border spinner-border-sm" role="status" aria-hidden="true"></div>
    </div>
  </form>
</div>
