{% extends "base.html" %}

{% block content %}
<div class="container py-4">
  <h4 class="mb-3">Processed Service Entries</h4>

  <!-- Filters -->
  <div class="card mb-3">
    <div class="card-body row g-2">

      <div class="col-md-4">
        <label class="form-label mb-1">Client</label>
        <select id="client_id" class="form-select">
          <option value="">All Clients</option>
          {% for c in clients %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label mb-1">Processed By</label>
        <select id="processed_by" class="form-select">
          <option value="">All Processors</option>
          {% for u in users %}
            <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="col-md-2">
        <label class="form-label mb-1">Service Type</label>
        <select id="service_type" class="form-select">
          <option value="">All Services</option>
          <option value="ticket">Ticket</option>
          <option value="visa">Visa</option>
          <option value="hotel">Hotel</option>
          <option value="transfer">Transfer</option>
          <option value="passport">Passport</option>
          <option value="insurance">Insurance</option>
          <option value="sightseeing">Sightseeing</option>
        </select>
      </div>

      <div class="col-md-2 d-flex align-items-end">
        <button class="btn btn-primary w-100" type="button" onclick="resetAndLoad()">Apply</button>
      </div>

    </div>
  </div>

  <!-- Table -->
  <div class="card">
    <div class="card-body p-0">
      <table class="table table-sm table-hover mb-0">
        <thead class="table-light">
          <tr>
            <th>Date</th>
            <th>Client</th>
            <th>Service</th>
            <th>Description</th>
            <th class="text-end">Amount</th>
            <th>Processed By</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="text-center py-3" id="loading" style="display:none;">Loading…</div>
</div>

<script>
let cursor = null;
let loading = false;
let done = false;

function getParams() {
  const p = new URLSearchParams();

  const clientId = document.getElementById("client_id").value;
  const pb = document.getElementById("processed_by").value;
  const st = document.getElementById("service_type").value;

  if (clientId) p.set("client_id", clientId);
  if (pb) p.set("processed_by", pb);
  if (st) p.set("service_type", st);

  if (cursor) {
    p.set("cursor_date", cursor.date);
    p.set("cursor_id", cursor.id);
  }
  return p.toString();
}

async function loadMore() {
  if (loading || done) return;
  loading = true;
  document.getElementById("loading").style.display = "block";

  const res = await fetch("{% url 'processed_services_data' %}?" + getParams());
  const data = await res.json();

  const tbody = document.getElementById("rows");
  (data.rows || []).forEach(r => {
    tbody.insertAdjacentHTML("beforeend", `
      <tr>
        <td>${r.booking_date}</td>
        <td>${r.client}</td>
        <td>${r.service_type}</td>
        <td>${r.description}</td>
        <td class="text-end">₹${Number(r.amount || 0).toFixed(0)}</td>
        <td>${r.processed_by}</td>
      </tr>
    `);
  });

  cursor = data.next_cursor;
  done = !data.has_more;

  loading = false;
  document.getElementById("loading").style.display = done ? "none" : "block";
}

function resetAndLoad() {
  cursor = null;
  done = false;
  document.getElementById("rows").innerHTML = "";
  loadMore();
}

window.addEventListener("scroll", () => {
  if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
    loadMore();
  }
});

loadMore();
</script>
{% endblock %}
